name: Test Google Cloud WIF

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  authenticate:
    name: Authenticate with Google Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate using Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/158792669647/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@project-44a57735-8615-4beb-a49.iam.gserviceaccount.com

      - name: Verify authentication
        run: echo "Google Cloud WIF authentication succeeded!"

      - name: Send status to SecureDeploy Dashboard
        if: always()
        run: |
          # Bypassing Cloudflare by resolving the domain directly to the raw server IP
          curl -X POST "https://lifah-gcp.zeroonedevs.in/api/deployments" \
          --resolve "lifah-gcp.zeroonedevs.in:443:8.231.117.125" \
          -H "Authorization: Bearer ${{ secrets.DASHBOARD_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{
            "appName": "WIF Auth Test",
            "environment": "production",
            "status": "${{ job.status }}",
            "branch": "${{ github.ref_name }}",
            "commitSha": "${{ github.sha }}",
            "workflowRunUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }'
